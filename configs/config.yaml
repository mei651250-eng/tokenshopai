server:
  port: 8080
  mode: debug  # debug | release | test
  read_timeout: 30s
  write_timeout: 120s
  graceful_wait: 15s
  # WebAuthn Relying Party 配置
  webauthn_origin: "http://localhost:3001"  # 生产环境改为 https://tokenshopai.com

database:
  host: localhost
  port: 5432
  user: tokenhub
  password: tokenhub_secret
  dbname: tokenhub
  max_idle_conns: 10
  max_open_conns: 100
  log_level: warn

redis:
  addr: localhost:6379
  password: ""  # 生产环境必须设置密码，通过环境变量 REDIS_PASSWORD 覆盖
  db: 0
  pool_size: 100
  min_idle_conns: 10

jwt:
  secret: ""  # 必须通过环境变量 JWT_SECRET 设置，启动时校验非空
  expire: 24h
  issuer: tokenhub
  refresh_exp: 168h

gateway:
  max_retries: 3
  timeout: 60s
  stream_timeout: 300s
  max_concurrent: 1000
  rate_limit_per_sec: 100

billing:
  default_currency: CNY
  min_balance: 100
  token_granularity: 1

# Web3 钱包与加密货币充值配置
wallet:
  # 平台收款地址（按链配置，实际生产中应为多签钱包或冷钱包）
  deposit_addresses:
    ethereum: "0x742d35Cc6634C0532925a3b844Bc9e7595f2bD18"
    bsc: "0x742d35Cc6634C0532925a3b844Bc9e7595f2bD18"
    polygon: "0x742d35Cc6634C0532925a3b844Bc9e7595f2bD18"
    arbitrum: "0x742d35Cc6634C0532925a3b844Bc9e7595f2bD18"
    optimism: "0x742d35Cc6634C0532925a3b844Bc9e7595f2bD18"
    tron: "TYDzsWUZbMF6n3qG1GmwVsQ1v9Xd9gKb0S"
    solana: "7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU"
    avalanche: "0x742d35Cc6634C0532925a3b844Bc9e7595f2bD18"
  # 区块链监控服务配置
  chain_monitor:
    poll_interval: 10s
    batch_size: 100

# 支付渠道配置
payment:
  alipay:
    enabled: true
    app_id: ""
    private_key: ""
    public_key: ""
    notify_url: "https://tokenshopai.com/auth/callback/alipay"
    is_sandbox: true
    logo_url: "/icons/alipay.svg"
  alipay_hk:
    enabled: true
    app_id: ""
    private_key: ""
    public_key: ""
    notify_url: "https://tokenshopai.com/auth/callback/alipay_hk"
    is_sandbox: true
    logo_url: "/icons/alipay_hk.svg"
  wechat_pay:
    enabled: true
    app_id: ""
    mch_id: ""
    api_key: ""
    cert_path: ""
    notify_url: "https://tokenshopai.com/auth/callback/wechat"
    is_sandbox: true
    logo_url: "/icons/wechat_pay.svg"
  paypal:
    enabled: true
    client_id: ""
    client_secret: ""
    mode: sandbox
    notify_url: "https://tokenshopai.com/auth/callback/paypal"
    logo_url: "/icons/paypal.svg"
  worldfirst:
    enabled: true
    merchant_id: ""
    api_key: ""
    api_secret: ""
    notify_url: "https://tokenshopai.com/auth/callback/worldfirst"
    logo_url: "/icons/worldfirst.svg"
  payoneer:
    enabled: true
    merchant_id: ""
    api_key: ""
    api_secret: ""
    notify_url: "https://tokenshopai.com/auth/callback/payoneer"
    logo_url: "/icons/payoneer.svg"
  wise:
    enabled: true
    api_key: ""
    profile_id: ""
    webhook_secret: ""
    notify_url: "https://tokenshopai.com/auth/callback/wise"
    logo_url: "/icons/wise.svg"
  stripe:
    enabled: true
    publishable_key: ""
    secret_key: ""
    webhook_secret: ""
    notify_url: "https://tokenshopai.com/auth/callback/stripe"
    logo_url: "/icons/stripe.svg"

# 验证码服务配置
verification:
  sms:
    provider: aliyun  # aliyun | tencent | twilio | vonage
    aliyun:
      access_key_id: ""
      access_key_secret: ""
      sign_name: "TokenHub"
      template_code: "SMS_123456"
    tencent:
      secret_id: ""
      secret_key: ""
      sdk_app_id: ""
      sign_name: "TokenHub"
      template_id: ""
    twilio:
      account_sid: ""
      auth_token: ""
      from_number: ""
    vonage:
      api_key: ""
      api_secret: ""
      from_name: "TokenHub"
    code_length: 6
    expire_minutes: 5
    cooldown_seconds: 60
    max_send_per_hour: 5
    max_verify_attempts: 5
  email:
    provider: smtp  # smtp | sendgrid
    smtp:
      host: "smtp.tokenshopai.com"
      port: 465
      username: ""
      password: ""
      from_address: "noreply@tokenshopai.com"
      from_name: "TokenHub"
    sendgrid:
      api_key: ""
      from_address: "noreply@tokenhub.com"
      from_name: "TokenHub"
    code_length: 6
    expire_minutes: 5
    cooldown_seconds: 60
    max_send_per_hour: 5

monitor:
  enable_metrics: true
  metrics_path: /metrics
  report_interval: 10s
  alert_webhook: ""

security:
  enable_waf: true
  enable_desensitize: true
  blocked_ips: []
  max_request_body: 10485760
  # CORS 跨域配置
  cors:
    allowed_origins:
      - "https://tokenshopai.com"
      - "https://www.tokenshopai.com"
    # 开发模式下可添加本地地址
    # - "http://localhost:3000"
    # - "http://localhost:5173"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
      - "PATCH"
    allowed_headers:
      - "Origin"
      - "Content-Type"
      - "Authorization"
      - "X-API-Key"
      - "X-Tenant-ID"
      - "X-Request-ID"
    max_age: 86400

i18n:
  default_locale: zh-CN
  supported_locales:
    - zh-CN
    - en-US
    - ja-JP
    - ko-KR

# 密钥保险库配置
keyvault:
  # 主加密密钥（必须通过环境变量 KEYVAULT_MASTER_KEY 设置，不能使用默认值）
  # 启动时会校验密钥长度 >= 32 字节
  master_key: ""

# 智能路由配置
smart_router:
  default_strategy: smart  # cheapest | fastest | round_robin | weighted | failover | smart
  cost_weight: 0.4
  latency_weight: 0.3
  reliability_weight: 0.3
  max_latency_ms: 30000
  min_success_rate: 0.95

# Token缓存配置
token_cache:
  enabled: true
  ttl: 10m
  max_entries: 100000

# 分销系统配置
distribution:
  default_commission_rate: 0.15
  max_levels: 2
  parent_commission_rate: 0.2
  settlement_day: 1  # 每月几号结算

# 配额默认值
quota:
  default_daily_tokens: 1000000
  default_monthly_tokens: 30000000
  default_daily_requests: 10000
  default_monthly_amount: 10000000  # 10万分
  default_alert_at: 0.8
  default_block_at: 1.0
