version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: tokenhub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tokenhub_secret}
      POSTGRES_DB: tokenhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=/app/configs/config.yaml
      - JWT_SECRET=${JWT_SECRET}
      - DB_PASSWORD=${DB_PASSWORD:-tokenhub_secret}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KEYVAULT_MASTER_KEY=${KEYVAULT_MASTER_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@tokenhub.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-https://tokenshopai.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
